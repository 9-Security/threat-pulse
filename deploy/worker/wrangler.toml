name = "soc-iocs-mcp"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Created with:
#   npx wrangler d1 create soc-iocs
# then paste the printed database_id here.
[[d1_databases]]
binding = "DB"
database_name = "soc-iocs"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[observability]
enabled = true
