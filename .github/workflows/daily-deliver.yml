name: Daily Taipei SOC report

# The schedule moved to wendy-lab, which runs the same steps from
# deploy/run-daily.sh on a systemd timer. Two schedulers would each collect the
# window independently, and because they fetch seconds or minutes apart they
# extract different articles, produce different report IDs, and so defeat the
# Resend idempotency key -- two mails, and whichever D1 push lands second
# overwrites the first.
#
# The host also keeps what CI could not: `reports/` and the enrichment cache
# persist instead of riding a cache key that can miss, and GitHub's cron may run
# hours late and is disabled entirely after 60 days without a commit. Feeds
# carry only recent items, so a day the collector misses is a day lost.
#
# Kept as a manual fallback: run it from the Actions tab if the host is down.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Write the report without calling Resend
        type: boolean
        default: false
      force_d1:
        description: >-
          Replace the day in D1 even if it holds more than this run collected.
          Only for a correction that legitimately has fewer.
        type: boolean
        default: false

concurrency:
  group: daily-soc-deliver
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    name: Deliver last 24 hours
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      RESEND_TO: ${{ secrets.RESEND_TO }}
      # Strongly advised, not optional. Without it NVD allows 5 requests per
      # 30s: a window with 727 new CVEs on 2026-09-09 needed 91 minutes of
      # waiting and overran the host's ceiling. Enrichment stops itself at
      # NVD_BUDGET_SECONDS now, so the run survives -- with most CVSS missing.
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Check Resend secrets
        run: |
          # A dry run never contacts Resend, so it needs no credentials: it can
          # verify the whole pipeline on a repository with nothing configured.
          if [ "${DRY_RUN}" = "true" ]; then
            for name in RESEND_FROM RESEND_TO RESEND_API_KEY; do
              if [ -z "${!name}" ]; then
                echo "::notice::${name} is not set; the dry run will stand in for it"
              fi
            done
            exit 0
          fi
          missing=0
          for name in RESEND_FROM RESEND_TO RESEND_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}" >&2
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Restore previous reports and CVE enrichment cache
        uses: actions/cache@v4
        with:
          path: |
            reports
            .cache/enrichment
          key: soc-reports-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            soc-reports-${{ runner.os }}-

      - name: Install package
        run: uv sync --frozen

      - name: Deliver SOC report
        run: |
          extra=()
          if [ "${DRY_RUN}" = "true" ]; then
            extra+=(--dry-run)
            # .invalid can never resolve, so a stand-in cannot reach anyone even
            # if the dry-run guard were ever removed.
            if [ -z "${RESEND_FROM}" ]; then
              extra+=(--from "SOC dry run <dry-run@dry-run.invalid>")
            fi
            if [ -z "${RESEND_TO}" ]; then
              extra+=(--to "dry-run@dry-run.invalid")
            fi
          fi
          # Recorded so the push step can use the path deliver reports rather
          # than guessing from a directory listing the cache restore repopulates.
          uv run soc-news-parser deliver \
            --hours 24 \
            --at 06:00 \
            --timezone Asia/Taipei \
            --output-dir reports \
            "${extra[@]}" | tee deliver.json
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

      - name: Push indicators to D1
        # The email is the deliverable; the D1 corpus is what agents query
        # later, so a push failure must not fail the run that already sent it.
        if: success()
        continue-on-error: true
        run: |
          # Checked here rather than in `if:` so an absent token says so. A
          # step skipped by its condition vanishes from the run with the run
          # still green, which is how an empty secret went unnoticed once.
          if [ "${DRY_RUN}" = "true" ]; then
            # A dry run is documented as the safe way to exercise the pipeline;
            # it must not delete and rewrite a day in the production corpus.
            echo "::notice::dry run; not pushing to D1"
            exit 0
          fi
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              # Both are required: without the account id wrangler tries to
              # enumerate /memberships and dies pointing at the wrong secret.
              echo "::notice::${name} is not set; skipping the D1 push"
              exit 0
            fi
          done
          # deliver names the file it wrote. Listing the directory instead picks
          # the lexicographically last folder, and the cache restore-key above
          # repopulates reports/ with earlier days -- so a dispatch in the small
          # hours of Taipei time, which lands on the previous slot, would export
          # a restored day this run never collected.
          evidence="$(python3 deploy/first_field.py --plain json_output < deliver.json)" || evidence=""
          if [ -z "${evidence}" ] || [ ! -f "${evidence}" ]; then
            echo "::warning::deliver named no readable evidence file; nothing to push"
            exit 0
          fi
          day="$(basename "$(dirname "${evidence}")")"
          # The date is interpolated into SQL and a /tmp path; the listing filter
          # that used to stand between an unexpected layout and both is gone.
          if ! [[ "${day}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::warning::evidence path does not name a dated folder: ${evidence}"
            exit 0
          fi
          # The same guard deploy/run-daily.sh applies. This workflow is
          # manual-dispatch only now, which makes it precisely the case the
          # guard exists for: re-collecting a window that closed hours ago
          # returns a decayed copy of it, and the exporter deletes and rewrites
          # the whole date. Both counts are compared, because a re-run that
          # still finds the headlines but can no longer read their bodies keeps
          # article_count and drops every indicator.
          if ! stored="$(npx --yes wrangler@3 d1 execute soc-iocs \
            --config deploy/worker/wrangler.toml --remote --json \
            --command "SELECT article_count, confirmed_ioc_count FROM reports WHERE report_date = '${day}'" \
            2>/dev/null | python3 deploy/first_field.py article_count confirmed_ioc_count)"; then
            # Exit 1 is "the answer could not be read" -- an expired token, a
            # changed wrangler envelope -- not "nothing stored yet". Collapsing
            # the two would replace a day on the strength of a failed lookup.
            if [ "${FORCE_D1}" != "1" ]; then
              echo "::warning::could not read the stored counts for ${day}; refusing to replace it unchecked. Re-run with force_d1 to override."
              exit 0
            fi
            stored=""
          fi
          if [ -n "${stored}" ] && [ "${FORCE_D1}" != "1" ]; then
            collected="$(python3 deploy/first_field.py --plain article_count confirmed_ioc_count < "${evidence}")"
            # `[ x -lt y ]` on a non-integer exits 2, which an `if` reads as
            # false, letting a malformed count past the comparison entirely.
            if ! [[ "${stored} ${collected}" =~ ^[0-9]+" "[0-9]+" "[0-9]+" "[0-9]+$ ]]; then
              echo "::warning::counts for ${day} are not numeric (stored='${stored}' collected='${collected}'); refusing to replace it unchecked"
              exit 0
            fi
            if [ "${collected%% *}" -lt "${stored%% *}" ] || [ "${collected##* }" -lt "${stored##* }" ]; then
              echo "::warning::refusing to replace ${day}: D1 holds '${stored}' (articles indicators), this run collected '${collected}'. Re-run with force_d1 to override."
              exit 0
            fi
          fi

          uv run soc-news-parser export-d1 \
            --json-report "${evidence}" \
            --date "${day}" \
            --output "/tmp/${day}.sql"
          npx --yes wrangler@3 d1 execute soc-iocs \
            --config deploy/worker/wrangler.toml \
            --remote --file "/tmp/${day}.sql"
          echo "pushed ${day} to D1"
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Without this the guard's own override message names something the
          # dispatch form cannot set, on the only path left when the host is down.
          FORCE_D1: ${{ inputs.force_d1 && '1' || '0' }}

      - name: Upload report artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soc-reports-${{ github.run_id }}
          path: reports
          if-no-files-found: error
          retention-days: 14
